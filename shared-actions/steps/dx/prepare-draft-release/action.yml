name: "Prepare draft release"
description: "When a pull request is merged, this runs on main branch and analyze labels to prepare the next release. It will update the current draft release or create it with updates"

inputs:
  appId:
    required: false
    default: ""
    description: ID of the GitHub app (used when token is empty)
  checkout:
    required: false
    default: "true"
    description: "Whether to checkout the repository (set to false if already done in a previous step)"
  configName:
    required: false
    default: "release-drafter.yml"
    description: Release-drafter config file name (resolved under .github/ when loaded from the repository)
  privateKey:
    required: false
    default: ""
    description: Private key of the GitHub app (used when token is empty)
  serverHost:
    required: false
    default: ""
    description: API hostname or URL for release-drafter GHE_HOST (e.g. git.example.com or gitea.server_url)
  token:
    required: false
    default: ""
    description: Repository token for checkout and release-drafter; uses GitHub app when empty
  workingDirectory:
    required: false
    default: "."
    description: "Reserved for future use; currently unused"

outputs:
  resolved-version:
    description: "Next resolved version (Gitea path only)"
    value: ${{ steps.gitea-draft.outputs.resolved-version }}
  tag-name:
    description: "Next release tag (Gitea path only)"
    value: ${{ steps.gitea-draft.outputs.tag-name }}
  bump:
    description: "Resolved semver bump: major/minor/patch (Gitea path only)"
    value: ${{ steps.gitea-draft.outputs.bump }}
  labels:
    description: "Comma-separated labels seen on included PRs (Gitea path only)"
    value: ${{ steps.gitea-draft.outputs.labels }}

runs:
  using: "composite"
  steps:
  - if: inputs.checkout == 'true' && inputs.token != ''
    name: Clone repository
    uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    with:
      fetch-depth: 0
      token: ${{ inputs.token }}

  - if: inputs.checkout == 'true' && inputs.token == ''
    name: Clone repository
    uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    with:
      fetch-depth: 0

  - if: inputs.serverHost != ''
    name: Resolve server host
    id: server-host
    shell: bash
    run: |
      host="${{ inputs.serverHost }}"
      host="${host#https://}"
      host="${host#http://}"
      host="${host%/}"
      echo "value=${host}" >> "$GITHUB_OUTPUT"

  - if: inputs.token == ''
    uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
    id: app-token
    with:
      client-id: ${{ inputs.appId }}
      private-key: ${{ inputs.privateKey }}

  # Gitea exposes no GraphQL API, so release-drafter fails with "404 page not
  # found" when it tries to find commits between refs. On a Gitea server we draft
  # the release through Gitea's REST API instead.
  - if: inputs.serverHost != ''
    id: gitea-draft
    name: Draft release (Gitea REST)
    shell: bash
    run: |
      python3 -m pip install --quiet --disable-pip-version-check pyyaml
      python3 "${{ github.action_path }}/draft_release_gitea.py"
    env:
      GITEA_TOKEN: ${{ inputs.token || steps.app-token.outputs.token }}
      GITEA_HOST: ${{ steps.server-host.outputs.value }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
      CONFIG_PATH: .github/${{ inputs.configName }}

  # On GitHub (no serverHost) keep using release-drafter, which relies on the
  # GitHub GraphQL API.
  - if: inputs.serverHost == ''
    uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
    with:
      config-name: ${{ inputs.checkout == 'true' && format('file:{0}', inputs.configName) || inputs.configName }}
    env:
      GITHUB_TOKEN: ${{ inputs.token || steps.app-token.outputs.token }}
