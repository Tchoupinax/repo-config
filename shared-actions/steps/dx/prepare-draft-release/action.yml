name: "Prepare draft release"
description: "When a pull request is merged, this runs on main branch and analyze labels to prepare the next release. It will update the current draft release or create it with updates"

inputs:
  appId:
    required: false
    default: ""
    description: ID of the GitHub app (used when token is empty)
  checkout:
    required: false
    default: "true"
    description: "Whether to checkout the repository (set to false if already done in a previous step)"
  configName:
    required: false
    default: "release-drafter.yml"
    description: Release-drafter config file name (resolved under .github/ when loaded from the repository)
  privateKey:
    required: false
    default: ""
    description: Private key of the GitHub app (used when token is empty)
  serverHost:
    required: false
    default: ""
    description: API hostname or URL for release-drafter GHE_HOST (e.g. git.example.com or gitea.server_url)
  token:
    required: false
    default: ""
    description: Repository token for checkout and release-drafter; uses GitHub app when empty
  workingDirectory:
    required: false
    default: "."
    description: "Reserved for future use; currently unused"

runs:
  using: "composite"
  steps:
  - if: inputs.checkout == 'true' && inputs.token != ''
    name: Clone repository
    uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    with:
      fetch-depth: 0
      token: ${{ inputs.token }}

  - if: inputs.checkout == 'true' && inputs.token == ''
    name: Clone repository
    uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    with:
      fetch-depth: 0

  - if: inputs.serverHost != ''
    name: Resolve server host
    id: server-host
    shell: bash
    run: |
      host="${{ inputs.serverHost }}"
      host="${host#https://}"
      host="${host#http://}"
      host="${host%/}"
      echo "value=${host}" >> "$GITHUB_OUTPUT"

  - if: inputs.token == ''
    uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
    id: app-token
    with:
      app-id: ${{ inputs.appId }}
      private-key: ${{ inputs.privateKey }}

  - if: inputs.serverHost != ''
    uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
    with:
      config-name: ${{ inputs.checkout == 'true' && format('file:{0}', inputs.configName) || inputs.configName }}
    env:
      GITHUB_TOKEN: ${{ inputs.token || steps.app-token.outputs.token }}
      GHE_HOST: ${{ steps.server-host.outputs.value }}

  - if: inputs.serverHost == ''
    uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
    with:
      config-name: ${{ inputs.checkout == 'true' && format('file:{0}', inputs.configName) || inputs.configName }}
    env:
      GITHUB_TOKEN: ${{ inputs.token || steps.app-token.outputs.token }}
