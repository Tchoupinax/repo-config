name: "Check code quality for Node.js application"
description: "This run lint command for Node.js application"

inputs:
  checkout:
    required: false
    default: "true"
    description: "Whether to checkout the repository (set to false if already done in a previous step)"
  command:
    required: false
    default: "lint"
    description: "Specify what is the command to lint"
  nodeVersion:
    required: false
    default: "25"
    description: "Node.js version to use"
  pnpmVersion:
    required: false
    description: "PNPM version to use (optional; also installed when pnpm-lock.yaml or packageManager is present)"
  throwOnError:
    required: false
    default: "true"
    description: "Set to false if error should be silenced"
  workingDirectory:
    required: false
    default: "."
    description: "Directory to run lint commands in"

runs:
  using: "composite"
  steps:
  - if: inputs.checkout == 'true'
    name: Checkout repository
    uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

  #- name: Validate package manager
  #  run: |
  #    case "${{ inputs.packageManager }}" in
  #      npm|yarn|pnpm) ;;
  #      *) echo "::error::packageManager must be one of: npm, yarn, pnpm. Got: ${{ inputs.packageManager }}"; exit 1 ;;
  #    esac
  #  shell: bash

  - name: Use Node.js ${{ inputs.nodeVersion }}
    uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
    with:
      node-version: ${{ inputs.nodeVersion }}

  - name: Detect pnpm
    id: pnpm
    run: |
      dir="${{ inputs.workingDirectory }}"
      needed=false
      has_package_manager=false
      if [ -f "$dir/pnpm-lock.yaml" ]; then
        needed=true
      fi
      if [ -f "$dir/package.json" ] && grep -qE '"packageManager"[[:space:]]*:[[:space:]]*"pnpm@' "$dir/package.json"; then
        needed=true
        has_package_manager=true
      fi
      echo "needed=$needed" >> $GITHUB_OUTPUT
      echo "has_package_manager=$has_package_manager" >> $GITHUB_OUTPUT
    shell: bash

  - name: Setup PNPM
    if: inputs.pnpmVersion != ''
    uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    with:
      version: ${{ inputs.pnpmVersion }}
      package_json_file: ${{ inputs.workingDirectory }}/package.json

  - name: Setup PNPM from packageManager
    if: inputs.pnpmVersion == '' && steps.pnpm.outputs.needed == 'true' && steps.pnpm.outputs.has_package_manager == 'true'
    uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    with:
      package_json_file: ${{ inputs.workingDirectory }}/package.json

  - name: Setup PNPM from lockfile
    if: inputs.pnpmVersion == '' && steps.pnpm.outputs.needed == 'true' && steps.pnpm.outputs.has_package_manager == 'false'
    uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    with:
      version: "11"
      package_json_file: ${{ inputs.workingDirectory }}/package.json

  - name: Install package manager handler
    run: npm i -g @antfu/ni@30.1.0 --force
    shell: bash

  - name: Install dependencies
    run: ni
    shell: bash
    working-directory: ${{ inputs.workingDirectory }}

  - name: Lint source code
    run: nr ${{ inputs.command }} ${{ inputs.throwOnError == 'false' && '|| true' || '' }}
    shell: bash
    working-directory: ${{ inputs.workingDirectory }}
