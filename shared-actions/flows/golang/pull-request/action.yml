name: "Pull request flow for Golang project"
description: "This is my standard pipeline for pull request on Golang project"

inputs:
  appId:
    required: true
    description: ID of the Github app
  privateKey:
    required: true
    description: Private key of the Github app
  workingDirectory:
    required: false
    default: "."
    description: "Directory containing the Go project (passed to underlying actions)"

runs:
  using: "composite"
  steps:
    - name: Check code quality 🫆
      uses: tchoupinax/repo-config/shared-actions/golang/golangci@52da881ac3b13a5639553ed5da6529b2f3dc8389 # v0.9.1
      with:
        workingDirectory: ${{ inputs.workingDirectory }}

    - name: Check build success 🦫
      uses: tchoupinax/repo-config/shared-actions/golang/goreleaser-build-only@52da881ac3b13a5639553ed5da6529b2f3dc8389 # v0.9.1
      with:
        workingDirectory: ${{ inputs.workingDirectory }}

    - name: Autodetect labels 🔍
      uses: tchoupinax/repo-config/shared-actions/dx/automatically-apply-labels@52da881ac3b13a5639553ed5da6529b2f3dc8389 # v0.9.1
      with:
        app-id: ${{ inputs.appId }}
        private-key: ${{ inputs.privateKey }}

